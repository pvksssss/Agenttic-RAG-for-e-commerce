chunking:
  chunk_size: 1000
  chunk_overlap: 200

retrieval:
  product:
    k_query: 15
    k_rerank: 5
  policy:
    k_query: 5
    k_rerank: 2
  graph_max_hops: 2 # number of traversal hops for graph retrieval
  rrf_k: 60 # smoothing constant for Reciprocal Rank Fusion

generation:
  temperature: 1.0
  max_tokens: 4096
  top_p: 1.0
  stream: True
  
agent:
  max_turns: 5       # Số lượt suy luận ReAct tối đa
  max_attempts: 3    # Số lần retry khi gặp lỗi API

llm:
  google:
    reasoning_effort: "MINIMAL" # options: "none", "default", "low", "medium", "high"
    available:
      - "gemini-3.5-flash-lite"
      - "gemini-3.1-flash-lite"
      - "gemma-4-26b-a4b-it"
      - "gemma-4-31b-it"
    
  groq:
    reasoning_effort: "none" # options: "none", "low", "medium", "high"
    available:
      - "openai/gpt-oss-120b"
      - "openai/gpt-oss-20b"
      - "qwen/qwen3.6-27b"
      
  openrouter:
    reasoning_effort: "medium"
    available:
      - "google/gemini-2.5-flash"
      - "meta-llama/llama-3.3-70b-instruct:free"
      - "qwen/qwen3-235b-a22b:free"


  # Cấu hình chỉ định model đang chạy thực tế cho từng tác vụ
  # Chỉ cần thay đổi 'provider' và 'model_key' ở đây để benchmark
  router:
    provider: "groq"
    model_key: "qwen3_6_27b"

  qa:
    provider: "groq"
    model_key: "gpt_oss_20b"

embedding:
  available:
    - "nvidia/llama-nemotron-embed-vl-1b-v2:free"  # Vision-Language, 2048 dims, đang dùng
  active: "nvidia/llama-nemotron-embed-vl-1b-v2:free"  # Model đang dùng thực tế


rerank:
  available:
    - "nvidia/llama-nemotron-rerank-vl-1b-v2:free"  
  active: "nvidia/llama-nemotron-rerank-vl-1b-v2:free"  