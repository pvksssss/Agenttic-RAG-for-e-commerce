chunking:
  chunk_size: 1000
  chunk_overlap: 200

retrieval:
  product:
    k_query: 15
    k_rerank: 5
  policy:
    k_query: 5
    k_rerank: 2
  graph_max_hops: 2 # Số bước duyệt qua các đỉnh trong đồ thị truy xuất (graph retrieval)
  rrf_k: 60 # Hằng số làm mịn cho thuật toán Reciprocal Rank Fusion (RRF)

generation:
  temperature: 1.0
  max_tokens: 4096
  top_p: 1.0
  stream: True
  
agent:
  max_turns: 5       # Số lượt suy luận ReAct tối đa
  max_attempts: 3    # Số lần retry khi gặp lỗi API

llm:
  google:
    reasoning_effort: "MINIMAL" # Các tùy chọn: "none", "default", "low", "medium", "high"
    available:
      - "gemini-3.5-flash-lite"
      - "gemini-3.1-flash-lite"
      - "gemma-4-26b-a4b-it"
      - "gemma-4-31b-it"
    
  groq:
    reasoning_effort: "none" # Các tùy chọn: "none", "low", "medium", "high"
    available:
      - "openai/gpt-oss-120b"
      - "openai/gpt-oss-20b"
      - "qwen/qwen3.6-27b"
      
  openrouter:
    reasoning_effort: "medium"
    available:
      - "google/gemini-2.5-flash"
      - "meta-llama/llama-3.3-70b-instruct:free"
      - "qwen/qwen3-235b-a22b:free"

  # Ollama - mô hình local (tương thích OpenAI API tại localhost:11434)
  ollama:
    base_url: "http://localhost:11434/v1"  # Đường dẫn API tương thích OpenAI của Ollama
    reasoning_effort: "none"               # Các tùy chọn: "none", "low", "medium", "high"
    supports_tools: true                   # Mô hình có hỗ trợ gọi hàm (function calling/tools) không
    available:
      - "gemma4:e2b"                       # Gemma 4 E2B chạy cục bộ (local) qua Ollama


  # Cấu hình chỉ định model đang chạy thực tế cho từng tác vụ
  # Chỉ cần thay đổi 'provider' và 'model_key' ở đây để benchmark
  router:
    provider: "groq"
    model_key: "qwen3_6_27b"

  qa:
    provider: "groq"
    model_key: "gpt_oss_20b"

embedding:
  available:
    - "nvidia/llama-nemotron-embed-vl-1b-v2:free"  # Vision-Language, 2048 dims, đang dùng
  active: "nvidia/llama-nemotron-embed-vl-1b-v2:free"  # Mô hình đang dùng thực tế


rerank:
  available:
    - "nvidia/llama-nemotron-rerank-vl-1b-v2:free"  
  active: "nvidia/llama-nemotron-rerank-vl-1b-v2:free"  